<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Edit meta tags for SEO -->
    <title>Justin Jinchuan Zheng | Research Portfolio</title>
    <meta name="title" content="Justin Zheng | Research Portfolio" />
    <meta
      name="description"
      content="Research portfolio of Justin Zheng, an undergraduate robotics researcher at the University of Michigan focusing on soft robotics and liquid-metal actuators."
    />

    <!-- Prevent initial white flash before React/CSS loads, but allow light mode after app loads -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background-color: #171c28;
      }

      body {
        min-height: 100vh;
        background-color: #171c28;
      }

      #root {
        min-height: 100vh;
      }

      body.app-loaded {
        background-color: #f7f9fc;
      }

      body.app-loaded.app-dark {
        background-color: #171c28;
      }
    </style>

    <script>
      (function () {
        function updateBodyBackground() {
          var root = document.getElementById("root");

          if (!root || !document.body) {
            return;
          }

          var isDarkMode = !!root.querySelector(".dark-mode");

          document.body.classList.add("app-loaded");

          if (isDarkMode) {
            document.body.classList.add("app-dark");
          } else {
            document.body.classList.remove("app-dark");
          }
        }

        document.addEventListener("DOMContentLoaded", function () {
          var root = document.getElementById("root");

          if (!root) {
            updateBodyBackground();
            return;
          }

          var observer = new MutationObserver(function () {
            updateBodyBackground();
          });

          observer.observe(root, {
            childList: true,
            subtree: true,
            attributes: true,
            attributeFilter: ["class"]
          });

          updateBodyBackground();

          setTimeout(updateBodyBackground, 500);
          setTimeout(updateBodyBackground, 1500);
        });
      })();
    </script>

    <!-- Open Graph / Facebook -->
