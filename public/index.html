<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Justin Jinchuan Zheng | Research Portfolio</title>
    <meta name="title" content="Justin Zheng | Research Portfolio" />
    <meta
      name="description"
      content="Research portfolio of Justin Zheng, an undergraduate robotics researcher at the University of Michigan focusing on soft robotics and liquid-metal actuators."
    />

    <!-- Keep the background stable while routes load. -->
    <style>
      html {
        --page-background: #171c28;
        --page-text: #ffffff;
        background-color: var(--page-background);
      }

      html[data-theme="light"] {
        --page-background: #f7f9fc;
        --page-text: #171c28;
      }

      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
        background-color: var(--page-background);
      }

      body,
      #root,
      #root > * {
        min-height: 100vh;
      }

      #root > * {
        animation: page-enter 0.2s ease-out;
      }

      .route-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: var(--page-text);
      }

      .route-loading-spinner {
        width: 24px;
        height: 24px;
        border: 3px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: route-spin 0.8s linear infinite;
      }

      @keyframes page-enter {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes route-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #root > *,
        .route-loading-spinner {
          animation: none;
        }
      }
    </style>

    <script>
      (function () {
        function applyTheme(isDark) {
          document.documentElement.setAttribute(
            "data-theme",
            isDark ? "dark" : "light"
          );
        }

        // Read the saved choice before React starts.
        var initialIsDark = true;

        try {
          var savedTheme = JSON.parse(localStorage.getItem("isDark"));

          if (typeof savedTheme === "boolean") {
            initialIsDark = savedTheme;
          }
        } catch (error) {
          // Use dark mode if storage is unavailable.
        }

        applyTheme(initialIsDark);

        document.addEventListener("DOMContentLoaded", function () {
          var root = document.getElementById("root");

          if (!root) return;

          function syncPageTheme() {
            // Keep the current theme while a route is loading.
            if (!root.querySelector(".header, .splash-container")) return;

            applyTheme(!!root.querySelector(".dark-mode"));
          }

          var observer = new MutationObserver(syncPageTheme);

          observer.observe(root, {
            childList: true,
            subtree: true,
            attributes: true,
            attributeFilter: ["class"]
          });

          syncPageTheme();
        });
      })();
    </script>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://justinjinchuanzheng.github.io/" />
    <meta property="og:title" content="Justin Zheng | Research Portfolio" />
    <meta
      property="og:description"
      content="Research portfolio of Justin Zheng, an undergraduate robotics researcher at the University of Michigan focusing on soft robotics and liquid-metal actuators."
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:url"
      content="https://justinjinchuanzheng.github.io/"
    />
    <meta
      property="twitter:title"
      content="Justin Zheng | Research Portfolio"
    />
    <meta
      property="twitter:description"
      content="Research portfolio of Justin Zheng, an undergraduate robotics researcher at the University of Michigan focusing on soft robotics and liquid-metal actuators."
    />

    <meta name="msapplication-TileColor" content="#171c28" />
    <meta name="theme-color" content="#171c28" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/umichLogo.png" />

    <!-- PWA manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Preload fonts -->
    <link
      rel="preload"
      href="/static/media/Montserrat-Regular.ee653992.ttf"
      as="font"
      type="font/woff"
      crossorigin
    />
    <link
      rel="preload"
      href="/static/media/Agustina.21f233e1.woff"
      as="font"
      type="font/woff"
      crossorigin
    />

    <!-- Google Analytics -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-6N2Z0SK3S1"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        dataLayer.push(arguments);
      }

      gtag("js", new Date());
      gtag("config", "G-6N2Z0SK3S1");
    </script>

    <!-- Font Awesome icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/FortAwesome/Font-Awesome@5.15.4/css/all.min.css"
    />
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
